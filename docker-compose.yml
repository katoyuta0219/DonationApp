services:
  api:
    build: ./back/
    volumes:
      - ./back:/workdir
    ports:
      - 8011:8000
  db:
    image: mysql:8.3
    volumes:
      - ./back/laravel_app/mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: dev
    ports:
      - 3308:3306
  app:
    build: ./front/
    volumes:
      - ./front:/workdir
    ports:
      - 3011:3000